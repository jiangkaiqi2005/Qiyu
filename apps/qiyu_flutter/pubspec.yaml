name: qiyu_flutter
description: Qiyu Flutter Web migration shell.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  go_router: ^17.4.0
  gpt_markdown: ^1.1.8
  http: ^1.6.0
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  qiyu_behavior_core:
    path: ../../packages/qiyu_behavior_core
  # 进程内本机 Host（安卓壳启动装配用）：条件导入缝保证 io 实现不进
  # web 构建，web 侧依然零依赖本包。
  qiyu_local_host:
    path: ../../packages/qiyu_local_host
  share_plus: ^13.3.0
  uuid: ^4.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-NotoSerifSC.txt
    - assets/fonts/APACHE-2.0-MaterialSymbolsOutlined.txt
    - assets/images/home-night-backdrop.jpg
    - assets/images/qiyu-web-icon.png
    - assets/images/qiyu-app-icon.png
    # 进程内 Host 的 system prompt 装配原料（栖语人格宪法）：与仓库根
    # `栖语人格宪法.md` 保持同步（Windows 壳由打包脚本复制同名文件，
    # 安卓壳打版权期内随 APK 分发）。
    - assets/persona/persona-constitution.md
    - assets/persona/persona-constitution.en.md
  fonts:
    # 全局唯一字族：思源宋体静态子集（紫夜规范 §3）。
    - family: Noto Serif SC
      fonts:
        - asset: assets/fonts/NotoSerifSC-QiyuSubset.ttf
    # 图标字族：Material Symbols Outlined 的 ExtraLight（wght 200）静态实例，
    # 已裁成本项目用到的 45 字形子集。紫夜规范 §4 要 1.2 细描边，Flutter 内置
    # Icons.* 是定宽字形且 Icon 没有 strokeWidth 入口，只有换字族才做得到。
    - family: Material Symbols Outlined
      fonts:
        - asset: assets/fonts/MaterialSymbolsOutlined-QiyuSubset.ttf
    # Roboto 别名必须保留：Material 内部默认引用 Roboto，若不随包提供会触发
    # gstatic 远程回退，本机 loopback 场景下直接卡死启动（2026-08 修复）。
    - family: Roboto
      fonts:
        - asset: assets/fonts/NotoSerifSC-QiyuSubset.ttf
