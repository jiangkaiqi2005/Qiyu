name: qiyu_flutter
description: Qiyu Flutter Web migration shell.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.4.0
  gpt_markdown: ^1.1.8
  http: ^1.6.0
  provider: ^6.1.5+1
  qiyu_behavior_core:
    path: ../../packages/qiyu_behavior_core
  uuid: ^4.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-NotoSerifSC.txt
    - assets/images/home-night-backdrop.jpg
  fonts:
    # 全局唯一字族：思源宋体静态子集（紫夜规范 §3）。
    - family: Noto Serif SC
      fonts:
        - asset: assets/fonts/NotoSerifSC-QiyuSubset.ttf
    # Roboto 别名必须保留：Material 内部默认引用 Roboto，若不随包提供会触发
    # gstatic 远程回退，本机 loopback 场景下直接卡死启动（2026-08 修复）。
    - family: Roboto
      fonts:
        - asset: assets/fonts/NotoSerifSC-QiyuSubset.ttf
