name: qiyu_local_host
description: Platform-agnostic local host core for Qiyu (shelf site, chat delivery, memory cadence, model gateway, Markdown persistence, credential store interface).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.7
  path: ^1.9.1
  qiyu_behavior_core:
    path: ../qiyu_behavior_core
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  # Omni 双工通话的 Host↔前端 WebSocket 传输（T03）：经现有 Host
  # 会话/Origin 边界升级，前端不直接拿 Key 连接 Provider。
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  coverage: ^1.15.1
  # 语音流式降级路径的外层流预算锁定用假时钟（真实时钟测不了 60s+ 的预算）。
  fake_async: ^1.3.1
  lints: ^6.0.0
  test: ^1.31.2
